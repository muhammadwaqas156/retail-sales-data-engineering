version: 2
models:
  - name: fact_sales
    description: One row per invoice line (after optional exact-duplicate removal). Flags and measures implement docs/business_rules.md.
    columns:
      - name: line_id
        tests: [unique, not_null]
      - name: invoice_no
        tests: [not_null]
      - name: customer_key
        tests:
          - not_null
          - relationships: {to: ref('dim_customer'), field: customer_key}
      - name: product_key
        tests:
          - not_null
          - relationships: {to: ref('dim_product'), field: product_key}
      - name: invoice_date
        tests:
          - relationships: {to: ref('dim_date'), field: date_key}
      - name: product_class
        tests:
          - accepted_values:
              values: [product, postage, manual, discount, samples, fees, adjustment, charity, test, gift_voucher]
  - name: dim_customer
    columns:
      - name: customer_key
        tests: [unique, not_null]
  - name: dim_product
    columns:
      - name: product_key
        tests: [unique, not_null]
  - name: dim_date
    columns:
      - name: date_key
        tests: [unique, not_null]
